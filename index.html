<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我ぞ魔王！〜勇者イジメと世界滅亡の狂想曲〜</title>
    <style>
        :root {
            --bg-color: #0b0713;
            --panel-bg: #160f26;
            --panel-border: #4a2e80;
            --gold: #ffd700;
            --gold-dark: #b89700;
            --purple-light: #b673ff;
            --purple-dark: #2a1845;
            --red: #ff4757;
            --green: #2ed573;
            --blue: #1e90ff;
            --text-main: #f1f2f6;
            --text-sub: #a4b0be;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, 'ヒラギノ角ゴ Pro W3', 'Hiragino Kaku Gothic Pro', 'メイリオ', Meiryo, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(138, 43, 226, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(255, 69, 0, 0.1) 0%, transparent 40%);
        }

        #app {
            width: 100%;
            max-width: 800px;
            background: var(--panel-bg);
            border: 3px solid var(--gold);
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(184, 151, 0, 0.3), inset 0 0 15px rgba(0,0,0,0.8);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ステータスバー */
        .status-header {
            background: linear-gradient(180deg, #24143d 0%, #160f26 100%);
            border-bottom: 2px solid var(--panel-border);
            padding: 12px 16px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
        }

        .stat-box {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 6px 10px;
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-sub);
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .stat-val-text {
            color: var(--gold);
            font-weight: bold;
        }

        .bar-bg {
            height: 8px;
            background: #221a36;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            width: 50%;
            transition: width 0.4s ease-in-out, background-color 0.3s;
            border-radius: 4px;
        }

        .bar-gold { background: linear-gradient(90deg, #f1c40f, #ffd700); }
        .bar-mental { background: linear-gradient(90deg, #ff4757, #ff6b81); }
        .bar-threat { background: linear-gradient(90deg, #9b59b6, #8e44ad); }
        .bar-stress { background: linear-gradient(90deg, #e67e22, #d35400); }

        /* メインエリア */
        .game-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 480px;
            position: relative;
        }

        .turn-badge {
            align-self: center;
            background: linear-gradient(90deg, var(--gold-dark), var(--gold));
            color: #000;
            font-weight: bold;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }

        /* キャラクター対話エリア */
        .speaker-box {
            display: flex;
            gap: 16px;
            align-items: center;
            background: rgba(10, 5, 20, 0.6);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 16px;
        }

        .avatar-container {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid var(--gold);
            background: var(--purple-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            box-shadow: 0 0 15px rgba(186, 115, 255, 0.3);
            overflow: hidden;
        }

        .avatar-svg {
            width: 70px;
            height: 70px;
        }

        .dialogue-content {
            flex: 1;
        }

        .speaker-name {
            font-weight: bold;
            color: var(--gold);
            font-size: 1.1rem;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .speaker-tag {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 10px;
            background: var(--purple-light);
            color: #000;
        }

        .dialogue-text {
            font-size: 1rem;
            line-height: 1.5;
            color: var(--text-main);
        }

        /* 選択肢ボタン */
        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
        }

        .choice-btn {
            background: linear-gradient(135deg, #251642 0%, #1a0f30 100%);
            border: 2px solid var(--panel-border);
            border-radius: 10px;
            padding: 14px 18px;
            color: var(--text-main);
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .choice-btn:hover {
            border-color: var(--gold);
            background: linear-gradient(135deg, #3d236e 0%, #28164b 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(184, 151, 0, 0.2);
        }

        .choice-btn:active {
            transform: translateY(0);
        }

        .choice-title {
            font-weight: bold;
            color: #fff;
            display: block;
            margin-bottom: 2px;
        }

        .choice-sub {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        /* タイトル・ギャラリー画面 */
        .title-screen, .gallery-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-color);
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
        }

        .title-crown {
            font-size: 4rem;
            margin-bottom: 10px;
            animation: floatCrown 3s ease-in-out infinite;
        }

        @keyframes floatCrown {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }

        .main-title {
            font-size: 2.2rem;
            color: var(--gold);
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            line-height: 1.3;
        }

        .main-sub {
            color: var(--text-sub);
            font-size: 1rem;
            margin-bottom: 30px;
            max-width: 500px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #ff4757, var(--gold));
            color: #000;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 14px 40px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 71, 87, 0.5);
            transition: all 0.2s;
            margin: 6px;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(255, 215, 0, 0.8);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid var(--panel-border);
            color: var(--text-main);
            font-weight: bold;
            font-size: 1rem;
            padding: 10px 24px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            margin: 6px;
        }

        .btn-secondary:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        /* エンディングモーダル */
        .ending-modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 2, 12, 0.95);
            z-index: 40;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .end-badge {
            background: var(--gold);
            color: #000;
            font-weight: bold;
            padding: 4px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-bottom: 12px;
        }

        .end-title {
            font-size: 2rem;
            color: var(--gold);
            margin-bottom: 16px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .end-desc {
            font-size: 1rem;
            color: var(--text-main);
            max-width: 550px;
            line-height: 1.6;
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--panel-border);
            margin-bottom: 24px;
        }

        /* 図鑑 */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            width: 100%;
            max-height: 360px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 20px;
        }

        .gallery-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 12px;
            text-align: left;
            font-size: 0.85rem;
        }

        .gallery-card.unlocked {
            border-color: var(--gold);
            background: rgba(184, 151, 0, 0.1);
        }

        .gallery-num {
            font-size: 0.75rem;
            color: var(--gold);
            font-weight: bold;
        }

        .gallery-name {
            font-size: 0.95rem;
            font-weight: bold;
            margin: 4px 0;
            color: #fff;
        }

        .gallery-card.locked .gallery-name {
            color: var(--text-sub);
        }

        @media (max-width: 600px) {
            .speaker-box { flex-direction: column; text-align: center; gap: 10px; }
            .speaker-name { justify-content: center; }
            .main-title { font-size: 1.6rem; }
            .game-body { padding: 12px; }
            .status-header { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

<div id="app">

    <div class="game-body">

        <div class="speaker-box">

        <div class="choices-container" id="choices-box">

            <button class="btn-primary" onclick="backToTitle()">タイトルへ戻る</button>
            <button class="btn-secondary" onclick="openGallery()">図鑑を見る</button>
        </div>

</div>

};

/* ===================================================
   Web Audio API 効果音
=================================================== */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function playSound(type) {
    try {
        if (!audioCtx) audioCtx = new AudioCtx();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'click') {
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
            osc.start(now);
            osc.stop(now + 0.08);
        } else if (type === 'win') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.15);
            osc.frequency.setValueAtTime(783.99, now + 0.3);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.6);
            osc.start(now);
            osc.stop(now + 0.6);
        } else if (type === 'bad') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.linearRampToValueAtTime(100, now + 0.4);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
        }
    } catch (e) {}
}

/* ===================================================
   ゲームエンジン & 状態管理
=================================================== */
function updateUI() {
    document.getElementById('turn-display').innerText = `DAY ${gameState.turn} / 15`;

    document.getElementById('val-gold').innerText = `${gameState.gold} G`;
    document.getElementById('bar-gold').style.width = `${Math.min(100, Math.max(0, gameState.gold / 10))}%`;

    document.getElementById('val-mental').innerText = `${gameState.mental}`;
    document.getElementById('bar-mental').style.width = `${Math.min(100, Math.max(0, gameState.mental))}%`;

    document.getElementById('val-threat').innerText = `${gameState.threat}`;
    document.getElementById('bar-threat').style.width = `${Math.min(100, Math.max(0, gameState.threat))}%`;

    document.getElementById('val-stress').innerText = `${gameState.stress}`;
    document.getElementById('bar-stress').style.width = `${Math.min(100, Math.max(0, gameState.stress))}%`;

    const unlocked = getUnlockedEndings();
    document.getElementById('unlocked-count').innerText = unlocked.length;
}

function loadScenario(turnIndex) {
    if (turnIndex >= SCENARIOS.length) {
        evaluateFinalEnding();
        return;
    }

    const scenario = SCENARIOS[turnIndex];

    document.getElementById('avatar-box').innerHTML = SVGS[scenario.speaker] || SVGS.maou;
    document.getElementById('speaker-name').querySelector('span:first-child').innerText = scenario.name;
    document.getElementById('speaker-tag').innerText = scenario.tag;
    document.getElementById('dialogue-text').innerText = scenario.text;

    const choicesBox = document.getElementById('choices-box');
    choicesBox.innerHTML = '';

    scenario.choices.forEach((c) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerHTML = `
            <div>
                <span class="choice-title">${c.title}</span>
                <span class="choice-sub">${c.sub}</span>
            </div>
            <span style="color: var(--gold); font-size: 1.2rem;">▶</span>
        `;
        btn.onclick = () => {
            playSound('click');
            c.action(gameState);
            checkInstantEndings();
        };
        choicesBox.appendChild(btn);
    });

    updateUI();
}

function checkInstantEndings() {
    if (gameState.gold <= 0) {
        triggerEnding(10);
        return;
    }
    if (gameState.stress >= 100) {
        triggerEnding(7);
        return;
    }
    if (gameState.sebLoveCount >= 4) {
        triggerEnding(9);
        return;
    }
    if (gameState.idleCount >= 4) {
        triggerEnding(12);
        return;
    }
    if (gameState.gold >= 999) {
        triggerEnding(2);
        return;
    }
    if (gameState.mental <= 0) {
        triggerEnding(1);
        return;
    }

    gameState.turn++;
    if (gameState.turn <= 15) {
        loadScenario(gameState.turn - 1);
    } else {
        evaluateFinalEnding();
    }
}

function evaluateFinalEnding() {
    if (gameState.sebLoveCount >= 3) {
        triggerEnding(9);
    } else if (gameState.mental <= 20) {
        triggerEnding(1);
    } else if (gameState.tradeCount >= 3) {
        triggerEnding(8);
    } else {
        triggerEnding(6);
    }
}

function triggerEnding(endingId) {
    const end = ENDINGS.find(e => e.id === endingId);
    if (!end) return;

    saveUnlockedEnding(endingId);

    if (endingId === 1 || endingId === 2 || endingId === 4 || endingId === 5 || endingId === 8 || endingId === 9) {
        playSound('win');
    } else {
        playSound('bad');
    }

    document.getElementById('end-badge').innerText = `ENDING ${String(end.id).padStart(2, '0')} - ${end.badge}`;
    document.getElementById('end-title').innerText = end.title;
    document.getElementById('end-desc').innerText = end.desc;

    document.getElementById('ending-modal').style.display = 'flex';
}

function getUnlockedEndings() {
    try {
        const data = localStorage.getItem('maou_game_endings');
        return data ? JSON.parse(data) : [];
    } catch(e) {
        return [];
    }
}

function saveUnlockedEnding(id) {
    try {
        const unlocked = getUnlockedEndings();
        if (!unlocked.includes(id)) {
            unlocked.push(id);
            localStorage.setItem('maou_game_endings', JSON.stringify(unlocked));
        }
    } catch(e) {}
}

function openGallery() {
    playSound('click');
    const unlocked = getUnlockedEndings();
    const list = document.getElementById('gallery-list');
    list.innerHTML = '';

    ENDINGS.forEach(e => {
        const isUnlocked = unlocked.includes(e.id);
        const card = document.createElement('div');
        card.className = `gallery-card ${isUnlocked ? 'unlocked' : 'locked'}`;
        card.innerHTML = `
            <div class="gallery-num">ENDING ${String(e.id).padStart(2, '0')}</div>
            <div class="gallery-name">${isUnlocked ? e.title : '？？？？？？？？'}</div>
            <div style="font-size:0.75rem; color:var(--text-sub);">${isUnlocked ? e.desc : '未解放の結末です。条件を探してみましょう！'}</div>
        `;
        list.appendChild(card);
    });

    document.getElementById('gallery-screen').style.display = 'flex';
}

function closeGallery() {
    playSound('click');
    document.getElementById('gallery-screen').style.display = 'none';
}

function startGame() {
    playSound('click');
    gameState = {
        turn: 1,
        gold: 500,
        mental: 100,
        threat: 20,
        stress: 0,
        idleCount: 0,
        tradeCount: 0,
        sebLoveCount: 0
    };

    document.getElementById('title-screen').style.display = 'none';
    document.getElementById('ending-modal').style.display = 'none';

    loadScenario(0);
}

function backToTitle() {
    playSound('click');
    document.getElementById('ending-modal').style.display = 'none';
    document.getElementById('title-screen').style.display = 'flex';
    updateUI();
}

window.onload = () => {
    updateUI();
};
</script>
</body>
</html>
